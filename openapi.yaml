openapi: 3.0.3
info:
  title: Task Manager API
  version: 1.0.0
  description: PostgreSQL-backed task management service with Redis list caching.
servers:
  - url: http://localhost:8080
paths:
  /tasks:
    get:
      summary: List tasks with optional filters and pagination
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: assignee
          in: query
          schema:
            type: string
            maxLength: 200
        - name: page
          in: query
          description: 1-based page number (default 1, maximum 1000000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          description: Number of results per page (default 20, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          description: Invalid filter or pagination parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
    post:
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Created task
          headers:
            Location:
              schema:
                type: string
                example: /tasks/e1f3d6b6-41f2-4910-9352-bd91856698a4
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid task or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Retrieve a task
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
    put:
      summary: Replace all editable fields of a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid UUID, task, or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
    delete:
      summary: Delete a task
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: Prometheus text exposition format
  /swagger:
    get:
      summary: Read this OpenAPI specification
      responses:
        '200':
          description: OpenAPI YAML document
components:
  schemas:
    TaskStatus:
      type: string
      enum: [pending, in_progress, completed]
    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          default: ''
        status:
          $ref: '#/components/schemas/TaskStatus'
        assignee:
          type: string
          maxLength: 200
    Task:
      type: object
      required: [id, title, description, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        status:
          $ref: '#/components/schemas/TaskStatus'
        assignee:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskPage:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
